name: data-sync

on:
  schedule:
    - cron: "30 20 * * *"   # 매일 05:30 KST — 식약처 부적합/회수 (일 단위 갱신)
    - cron: "0 21 * * 0"    # 매주 월 06:00 KST — 법령 (저빈도)
  workflow_dispatch:
    inputs:
      job:
        description: "실행할 잡 (all/rejections/recalls/laws) — laws 선택 시 hs alert digest도 함께 실행됨"
        default: "all"

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
      LAW_GO_KR_OC: ${{ secrets.LAW_GO_KR_OC }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      INTERNAL_JOB_SECRET: ${{ secrets.INTERNAL_JOB_SECRET }}
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci || npm install

      # 매일: 부적합 + 회수
      # apis.data.go.kr가 GH Actions 러너발 연결에 간헐적으로 타임아웃을 낸다(외부망 문제,
      # 코드 문제 아님). continue-on-error로 한쪽이 실패해도 잡 전체가 "failed" 처리되어
      # 아래 주간 법령/알림 스텝까지 스킵되는 일이 없게 한다.
      - name: daily rejections
        if: github.event.schedule == '30 20 * * *' || contains(fromJSON('["all","rejections"]'), inputs.job)
        run: npm run sync:rejections
        continue-on-error: true
      - name: daily recalls
        if: github.event.schedule == '30 20 * * *' || contains(fromJSON('["all","recalls"]'), inputs.job)
        run: npm run sync:recalls
        continue-on-error: true

      # 매주: 법령
      # 세관장확인대상물품(requirements)은 검색 시 실시간 조회+캐시하는
      # Supabase Edge Function(requirements-lookup)으로 이전됨. pipeline/jobs/sync_requirements.js
      # 참고용으로만 리포에 남겨둠.
      # law.go.kr도 같은 이유로 간헐적 타임아웃이 남 — 실패해도 아래 hs alert digest는
      # 계속 실행되게 continue-on-error(그 시점까지 DB에 있던 regulation_updates로 매칭).
      - name: weekly law updates
        if: github.event.schedule == '0 21 * * 0' || contains(fromJSON('["all","laws"]'), inputs.job)
        run: npm run sync:laws
        continue-on-error: true

      # 관심 HS코드 알림 — 위에서 갱신된 regulation_updates를 확인된 구독과 매칭해 발송.
      # 별도 cron 없이 법령 동기화 직후에 이어 실행(같은 조건).
      - name: weekly hs code alert digest
        if: github.event.schedule == '0 21 * * 0' || contains(fromJSON('["all","laws"]'), inputs.job)
        run: npm run sync:hsalerts

      # HS코드 마스터 목록(pipeline/jobs/sync_hs_codes.js)은 GitHub Actions에서 자동 실행 안 함:
      # www.data.go.kr(포털)이 해외/클라우드 IP를 차단해 GH Actions 러너에서 연결 자체가 안 됨
      # (apis.data.go.kr API 서버는 별도 인프라라 문제없음). 연 1회, 한국 IP인 사용자 브라우저에서
      # 파일을 직접 파싱해 Supabase Edge Function(hs-codes-bulk-load)으로 업로드하는 방식으로 대체.
